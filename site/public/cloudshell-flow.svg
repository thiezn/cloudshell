<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 218" role="img" aria-labelledby="title desc">
    <title id="title">CloudShell connection flow</title>
    <desc id="desc">The cloudshell CLI calls AWS APIs to manage an environment, then uses the Session Manager bridge to open an interactive shell.</desc>
