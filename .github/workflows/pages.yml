name: Documentation site

on:
    push:
        branches: [main]
        paths:
            - "site/**"
            - ".github/workflows/pages.yml"
    pull_request:
        paths:
            - "site/**"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

env:
    ZOLA_VERSION: "0.23.6"

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Install Zola
              run: |
                  curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
                    | tar -xz -C /usr/local/bin zola
                  zola --version
            - name: Check internal links and templates
              working-directory: site
              run: zola check --skip-external-links
            - name: Build
              working-directory: site
              run: zola build
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site/public

    deploy:
        if: github.event_name != 'pull_request'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        permissions:
            pages: write
            id-token: write
        steps:
            - uses: actions/deploy-pages@v5
              id: deployment
