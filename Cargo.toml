[package]
name = "cloudshell"
version = "0.1.0"
edition = "2024"
authors = ["thiezn"]
license = "MIT"
repository = "https://github.com/thiezn/cloudshell"
homepage = "https://thiezn.github.io/cloudshell/"
description = "Rust library and CLI implementing the AWS CloudShell APIs"
keywords = ["aws", "cloudshell"]
categories = ["network-programming"]
readme = "README.md"


[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
uninlined_format_args = "warn"
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-ec2 = "1"
aws-sigv4 = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = "1"
aws-ssm-bridge = "0.6"
clap = { version = "4", features = ["derive"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
# https://nnethercote.github.io/perf-book/build-configuration.html
codegen-units = 1
lto = "fat"

# This will enable debug symbols in the release build making it increase in size.
# It will not slow down the actual release. Still for running in containers, it
# would be good if we can disable this when pushing to Container registry.
debug = true
